[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.45,<2", "langchain>=1,<2", "langchain-openai>=1,<2",
  "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
